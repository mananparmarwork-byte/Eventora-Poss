    <div id="root"><p style="font-family:sans-serif;padding:24px;color:#555">Loading estimator&hellip;</p></div>

      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && r.children.length <= 1) {
          r.innerHTML = '<pre style="white-space:pre-wrap;font:14px monospace;padding:24px;color:#a00">Startup error:\n' + (e.message || e.target && (e.target.src || e.target.href) || 'unknown') + '</pre>';
        }
      }, true);
    </script>
